<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DevFusion UI 改版对比</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f5f6f8; color: #1f2329; }
  header { background: #fff; padding: 20px 32px; border-bottom: 1px solid #e5e6eb; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: #86909c; font-size: 13px; }
  h2 { margin: 32px 32px 12px; font-size: 16px; color: #0064ff; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 0 32px 32px; }
  .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h3 { margin: 0; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #f0f1f3; }
  .row { display: grid; grid-template-columns: 1fr 1fr; }
  .row .label { padding: 6px 16px; font-size: 12px; color: #86909c; background: #fafbfc; }
  .row img { width: 100%; display: block; border-top: 1px solid #f0f1f3; }
  .tag { display: inline-block; background: #e8ffea; color: #00b42a; border-radius: 4px; padding: 1px 8px; font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>DevFusion UI 改版对比</h1>
  <div class="sub">第一部分：改版前 → 改版后（1440×900）；第二部分：页面级深审 review-before → review-after（项目内组件）。</div>
</header>

<h2>一、改版前 / 改版后</h2>
<div class="grid" id="main"></div>

<h2>二、页面级深审：review-before → review-after（项目内组件，1440）</h2>
<div class="grid" id="review"></div>

<script>
const main = [
  ['login','登录',true],
  ['dashboard','总览',true],
  ['projects','项目列表',true],
  ['project-detail-stories','项目详情-需求列表',true],
  ['board','看板',true],
  ['iteration','迭代',true],
  ['test-cases','测试用例',true],
  ['work-item-drawer','工作项详情抽屉',true],
  ['application-detail','应用详情',true],
  ['pipeline-editor','流水线编排',true],
  ['run-detail','构建详情',true],
  ['artifacts','制品库',true],
  ['deployments','部署管理',true],
  ['user-admin','用户管理',true],
  ['workbench','我的工作台（新增页）',false],
  ['backlog','待规划（原 Backlog）',false],
  ['testplan','测试计划（新增页）',false],
  ['release','发布（新增页）',false],
  ['report','缺陷报表（新增页）',false],
  ['environments','环境管理（新增页）',false],
  ['metrics','效能度量（新增页）',false],
  ['tokens','个人令牌（新增页）',false],
];

const review = [
  ['proj-story','需求列表'],
  ['proj-task','任务列表'],
  ['proj-bug','缺陷列表'],
  ['proj-board','看板'],
  ['proj-backlog','待规划（原 Backlog）'],
  ['proj-iteration','迭代'],
  ['proj-testcase','测试用例'],
  ['proj-testplan','测试计划'],
  ['proj-release','发布'],
  ['proj-report','缺陷报表'],
  ['proj-member','成员'],
  ['proj-settings','项目设置'],
  ['proj-drawer','工作项抽屉'],
];

function card(title, before, after, bDir, aDir, isNew) {
  return `<div class="card"><h3>${title}${isNew?'<span class="tag">新增页面</span>':''}</h3>
    <div class="row">
      <div><div class="label">${isNew?'（无改版前图）':'改版前'}</div><img src="${bDir}/${before}" loading="lazy"></div>
      <div><div class="label">改版后</div><img src="${aDir}/${after}" loading="lazy"></div>
    </div></div>`;
}

document.getElementById('main').innerHTML = main.map(([f,t,hasBefore]) =>
  hasBefore ? card(t, `${f}.png`, `${f}.png`, 'before', 'after', false)
            : card(t, 'login.png', `${f}.png`, 'before', 'after', true)
).join('');

document.getElementById('review').innerHTML = review.map(([f,t]) =>
  card(t, `${f}-1440.png`, `${f}-1440.png`, 'review-before', 'review-after', false)
).join('');
</script>
</body>
</html>
